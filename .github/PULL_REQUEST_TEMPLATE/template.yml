name: Pull Request
description: Make a change
body:
  - type: markdown
    attributes:
      value: |
        Before making a PR please check out the [Contributing Guidelines](https://github.com/PixelGuys/Cubyz/blob/master/docs/CONTRIBUTING.md) and thoroughly test your changes.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Please link related issues. If any issues are closed by this PR please mention them as "fixes #123456". If neither applies please add a small description of why this change should be added to the game.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Please describe any decisions you made during the implementation and why.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: What did you test to ensure that your addition works as intended?
    validations:
      required: true
