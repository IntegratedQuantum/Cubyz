Before making a PR please check out the [Contributing Guidelines](https://github.com/PixelGuys/Cubyz/blob/master/docs/CONTRIBUTING.md) and thoroughly test your changes.
For smaller or content changes please discard this template and write just a small description and some screenshots.

## Motivation
Link related issues (if issues would be closed, write "fixes #123456", this will automatically close the issue)
If there are no issues, please explain the motivation for this change

## Implementation
Please explain any design decisions that were made. Screenshots could also be added here if appropiate.

## Testing
What did you test to ensure your addition works as intended?
